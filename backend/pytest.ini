[pytest]
# Adds the backend/ dir (rootdir) to sys.path so `from app.main import app`
# works — without this, CI fails with "ModuleNotFoundError: No module named 'app'".
pythonpath = .
testpaths = tests
# Run the async tests/fixtures in test_auth.py without needing per-test markers.
# Requires pytest-asyncio to be installed (the CI workflow installs it).
asyncio_mode = auto
