services:
  - type: web
    name: detomsite-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEFAULT_SUPER_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_SUPER_ADMIN_PASSWORD
        sync: false

  # Keep the free web service awake (Render free tier sleeps after idle).
  - type: cron
    name: detomsite-keep-alive
    runtime: python
    plan: free
    schedule: "*/5 * * * *"
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/keep_alive.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HEALTH_URL
        value: https://detomsite-backend.onrender.com/health