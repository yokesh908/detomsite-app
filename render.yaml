services:
  - type: web
    name: detomsite-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEFAULT_SUPER_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_SUPER_ADMIN_PASSWORD
        sync: false
      # Read cache. Use Render's "Key Value" instance for REDIS_URL (add the
      # optional `redis` package), or an Upstash/Vercel KV REST URL + token.
      # Leave all four empty to run without a shared cache.
      - key: REDIS_URL
        sync: false
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
      - key: REDIS_KEY_PREFIX
        value: "detomsite:"
